<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Меню столовой</title>
  <!-- Подключаем Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #ff5631;
      --bg: #f5f5f7;
      --text: #1a1a1a;
      --card: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 8px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 16px;
    }
    .category-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: var(--card);
      text-align: left;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .category-btn:active {
      background: #eee;
    }
    .dishes-list {
      margin-top: 12px;
    }
    .dish-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .dish-name {
      flex: 1;
      margin-right: 12px;
    }
    .checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
    }
    .order-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
    .loading {
      text-align: center;
      color: #888;
      margin-top: 32px;
    }
    .error {
      color: #d32f2f;
      text-align: center;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="menu-title">🍽 Меню столовой</h1>
    <div id="categories"></div>
    <div id="dishes" class="dishes-list"></div>
    <button class="order-btn" id="order-btn" disabled>Оформить заказ</button>
    <p id="status" class="loading">Загрузка меню...</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const repo = "donfrizo/you_like_foodtrack";
    const branch = "main";

    let menuData = null;
    let selectedIds = [];

    async function loadMenu() {
      const url = `https://raw.githubusercontent.com/${repo}/${branch}/menu.json?ts=${Date.now()}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Network error");
        menuData = await res.json();
        render();
      } catch (e) {
        document.getElementById("status").className = "error";
        document.getElementById("status").innerText = "Не удалось загрузить меню. Проверьте, что menu.json есть в репозитории.";
        console.error(e);
      }
    }

    function render() {
      const title = document.getElementById("menu-title");
      const catsDiv = document.getElementById("categories");
      const dishesDiv = document.getElementById("dishes");
      const orderBtn = document.getElementById("order-btn");
      const status = document.getElementById("status");

      if (!menuData || !menuData.dishes) {
        status.innerText = "Меню не найдено";
        return;
      }

      title.innerText = `🍽 Меню на ${menuData.m_date}`;

      // Категории
      const categories = ["first", "hot", "garnish", "salad"];
      catsDiv.innerHTML = categories.map(c => {
        const names = {
          "first": "🥣 Первые блюда",
          "hot": "🍖 Горячие блюда",
          "garnish": "🍚 Гарниры",
          "salad": "🥗 Салаты"
        };
        return `<button class="category-btn" onclick="filterCategory('${c}')">${names[c]}</button>`;
      }).join("");

      // Все блюда по умолчанию
      renderDishes(menuData.dishes);

      status.style.display = "none";
      orderBtn.disabled = false;
    }

    function filterCategory(category) {
      const filtered = menuData.dishes.filter(d => d.category === category);
      renderDishes(filtered);
    }

    function renderDishes(dishes) {
      const container = document.getElementById("dishes");
      container.innerHTML = dishes.map(d => {
        const isSelected = selectedIds.includes(d.id);
        return `
          <div class="dish-item">
            <span class="dish-name">${escapeHtml(d.name)}</span>
            <input type="checkbox" class="checkbox" ${isSelected ? "checked" : ""}
              onchange="toggleSelection(${d.id})" />
          </div>
        `;
      }).join("");
    }

    function toggleSelection(id) {
      const idx = selectedIds.indexOf(id);
      if (idx === -1) {
        selectedIds.push(id);
      } else {
        selectedIds.splice(idx, 1);
      }
      updateOrderButton();
    }

    function updateOrderButton() {
      const btn = document.getElementById("order-btn");
      btn.disabled = selectedIds.length === 0;
    }

    document.getElementById("order-btn").addEventListener("click", () => {
      if (selectedIds.length === 0) return;
      const link = `/start o_${selectedIds.join("_")}`;
      tg.sendData(link);
      // Если sendData не сработает (не в приватном чате), можно открыть ссылку:
      // window.location.href = `https://t.me/QuickInviteBot${link}`;
    });

    // Защита от XSS
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadMenu();
  </script>
</body>
</html>
