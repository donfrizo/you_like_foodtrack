<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Меню столовой</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #ff5631;
      --bg: #f8f9fa;
      --text: #1e1e1e;
      --card: #ffffff;
      --border: #e0e0e0;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 8px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      line-height: 1.2;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .category-btn {
      display: block;
      padding: 14px 8px;
      border: none;
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .category-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .dishes-list {
      margin-top: 12px;
    }
    .dish-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--card);
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }
    .dish-name {
      flex: 1;
      margin-right: 12px;
      font-size: 16px;
      line-height: 1.3;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .order-btn {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 86, 49, 0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    .order-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }
    .order-btn:active {
      transform: scale(0.98);
    }
    .loading {
      text-align: center;
      color: #888;
      margin-top: 32px;
      font-size: 15px;
    }
    .error {
      color: #d32f2f;
      text-align: center;
      margin-top: 32px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="menu-title">🍽 Меню столовой</h1>
    <div class="categories" id="categories"></div>
    <div id="dishes" class="dishes-list"></div>
    <button class="order-btn" id="order-btn" disabled>Оформить заказ</button>
    <p id="status" class="loading">Загрузка меню...</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const repo = "donfrizo/you_like_foodtrack";
    const branch = "main";

    let menuData = null;
    let selectedIds = [];

    async function loadMenu() {
      const url = `https://raw.githubusercontent.com/${repo}/${branch}/menu.json?ts=${Date.now()}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Network error");
        menuData = await res.json();
        render();
      } catch (e) {
        document.getElementById("status").className = "error";
        document.getElementById("status").innerText = "Не удалось загрузить меню. Проверьте, что menu.json есть в репозитории.";
        console.error(e);
      }
    }

    function render() {
      const title = document.getElementById("menu-title");
      const catsDiv = document.getElementById("categories");
      const dishesDiv = document.getElementById("dishes");
      const orderBtn = document.getElementById("order-btn");
      const status = document.getElementById("status");

      if (!menuData || !menuData.dishes) {
        status.innerText = "Меню не найдено";
        return;
      }

      title.innerText = `🍽 Меню на ${menuData.m_date}`;

      const categories = ["first", "hot", "garnish", "salad"];
      const names = {
        "first": "🥣 Первые",
        "hot": "🍖 Горячие",
        "garnish": "🍚 Гарниры",
        "salad": "🥗 Салаты"
      };

      catsDiv.innerHTML = categories.map(c => {
        return `<button class="category-btn" onclick="filterCategory('${c}')">${names[c]}</button>`;
      }).join("");

      renderDishes(menuData.dishes);

      status.style.display = "none";
      orderBtn.disabled = false;
    }

    function filterCategory(category) {
      const filtered = menuData.dishes.filter(d => d.category === category);
      renderDishes(filtered);
    }

    function renderDishes(dishes) {
      const container = document.getElementById("dishes");
      container.innerHTML = dishes.map(d => {
        const isSelected = selectedIds.includes(d.id);
        return `
          <div class="dish-item">
            <span class="dish-name">${escapeHtml(d.name)}</span>
            <input type="checkbox" class="checkbox" ${isSelected ? "checked" : ""}
              onchange="toggleSelection(${d.id})" />
          </div>
        `;
      }).join("");
    }

    function toggleSelection(id) {
      const idx = selectedIds.indexOf(id);
      if (idx === -1) {
        selectedIds.push(id);
      } else {
        selectedIds.splice(idx, 1);
      }
      updateOrderButton();
    }

    function updateOrderButton() {
      const btn = document.getElementById("order-btn");
      btn.disabled = selectedIds.length === 0;
    }

    document.getElementById("order-btn").addEventListener("click", () => {
      if (selectedIds.length === 0) return;
      const link = `/start o_${selectedIds.join("_")}`;
      tg.sendData(link);
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadMenu();
  </script>
</body>
</html>
