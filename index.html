<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Меню столовой</title>
  <!-- Подключаем SDK Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      margin: 0;
      padding: 10px;
    }
    h1 { margin-top: 0; }
    .category { margin: 20px 0; }
    .dish {
      padding: 8px 12px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .selected { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
    button {
      border: none;
      background: transparent;
      color: inherit;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
    }
    #total { margin-top: 15px; font-weight: bold; }
    #send-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 12px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <h1>🍽 Меню столовой</h1>
  <div id="menu-container"></div>
  <div id="total">Сумма: 0 ₽</div>
  <button id="send-btn">Отправить заказ</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Здесь можно подставить меню прямо в код (для теста без бэкенда)
    const menu = [
      { id: 1, category: 'first', name: 'Куриный бульон с лапшой', price: 220 },
      { id: 2, category: 'first', name: 'Солянка мясная', price: 280 },
      { id: 3, category: 'hot', name: 'Запечённая куриная грудка', price: 310 },
      { id: 4, category: 'hot', name: 'Лосось с овощами', price: 420 },
      { id: 5, category: 'salad', name: 'Салат Цезарь с курицей', price: 250 },
      { id: 6, category: 'salad', name: 'Тёплый салат со стручковой фасолью', price: 270 },
    ];

    const categories = ['first', 'hot', 'salad'];
    const names = {
      first: '🥣 Первые блюда',
      hot: '🍖 Горячие блюда',
      salad: '🥗 Салаты',
    };

    let selected = []; // массив id выбранных блюд

    function render() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      categories.forEach(cat => {
        const catItems = menu.filter(m => m.category === cat);
        if (!catItems.length) return;
        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        catDiv.innerHTML = `<h2>${names[cat]}</h2>`;
        catItems.forEach(item => {
          const dishEl = document.createElement('div');
          dishEl.className = `dish ${selected.includes(item.id) ? 'selected' : ''}`;
          dishEl.innerHTML = `
            <span>${item.name} — ${item.price} ₽</span>
            <button onclick="toggle(${item.id})">${selected.includes(item.id) ? 'Убрать' : 'Выбрать'}</button>
          `;
          catDiv.appendChild(dishEl);
        });
        container.appendChild(catDiv);
      });
      updateTotal();
    }

    function toggle(id) {
      if (selected.includes(id)) {
        selected = selected.filter(i => i !== id);
      } else {
        selected.push(id);
      }
      render();
    }

    function updateTotal() {
      const total = selected
        .map(id => menu.find(m => m.id === id).price || 0)
        .reduce((a, b) => a + b, 0);
      document.getElementById('total').textContent = `Сумма: ${total} ₽`;
    }

    document.getElementById('send-btn').addEventListener('click', () => {
      if (!selected.length) {
        alert('Выберите хотя бы одно блюдо');
        return;
      }
      const order = {
        dishes: selected.map(id => menu.find(m => m.id === id)),
        total: selected
          .map(id => menu.find(m => m.id === id).price)
          .reduce((a, b) => a + b, 0),
      };
      // Отправляем данные в бот
      tg.sendData(JSON.stringify(order));
    });

    render();
  </script>
</body>
</html>
