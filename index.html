<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ЯръКухня</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg-color: #1c1c1e;
        --card-bg: #2c2c2e;
        --text-main: #ffffff;
        --text-secondary: #aaaaaa;
        --accent: #ff5631;
        --border: #3a3a3c;
      }

      body {
        margin: 0;
        padding: 16px;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .date-block {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .date-block h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: var(--text-main);
      }

      .logo-block img {
        height: 40px;
        width: auto;
        object-fit: contain;
        border-radius: 8px;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-main);
      }

      .dish-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 12px;
        color: var(--text-main);
      }

      .dish-card:last-child {
        margin-bottom: 0;
      }

      .dish-text {
        margin: 0;
        font-size: 15px;
        line-height: 1.4;
      }

      .empty-state {
        text-align: center;
        color: var(--text-secondary);
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <div class="date-block">
        <span style="display: flex; align-items: center; gap: 6px;">📅</span>
        <h1>Меню на 03.11.2026</h1>
      </div>
      <div class="logo-block">
        <!-- ВСТАВЬ СЮДА ПРЯМУЮ ССЫЛКУ НА ЛОГОТИП -->
        <img src="https://raw.githubusercontent.com/donfrizo/you_like_foodtrack/main/logo.png" alt="Логотип ЯръКухня" />
      </div>
    </div>

    <div class="section-title">
      <span>🍲</span>
      <span>Первые блюда</span>
    </div>

    <div class="dish-card">
      <p class="dish-text">Суп-пюре из тыквы с имбирём и сливками</p>
    </div>
    <div class="dish-card">
      <p class="dish-text">Куриный бульон с домашней лапшой и зеленью</p>
    </div>
    <div class="dish-card">
      <p class="dish-text">Солянка мясная сборная с лимоном и сметаной</p>
    </div>

    <div class="section-title">
      <span>🍖</span>
      <span>Горячие блюда</span>
    </div>

    <div class="empty-state">
      Пока нет горячих блюд на эту дату.
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    </script>
  </body>
</html>
